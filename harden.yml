---
- name: Initial VPS Hardening
  hosts: vps
  become: yes
  vars_files:
    - vars.yml

  tasks:
    # ---------------------------------------------------------
    # 1. SYSTEM UPDATES
    # ---------------------------------------------------------
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install essential security packages
      apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - sudo
        state: present

    # ---------------------------------------------------------
    # 2. USER MANAGEMENT
    # ---------------------------------------------------------
    - name: Create a new non-root user
      user:
        name: "{{ new_user }}"
        state: present
        shell: /bin/bash
        create_home: yes

    - name: Add new user to sudoers (passwordless for automation)
      copy:
        dest: "/etc/sudoers.d/{{ new_user }}"
        content: "{{ new_user }} ALL=(ALL) NOPASSWD: ALL\n"
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'

    # ---------------------------------------------------------
    # 3. SSH KEY SETUP
    # ---------------------------------------------------------
    - name: Set authorized SSH key for the new user
      authorized_key:
        user: "{{ new_user }}"
        state: present
        key: "{{ lookup('file', ssh_public_key_path) }}"

    # ---------------------------------------------------------
    # 4. FIREWALL (UFW) SETUP
    # ---------------------------------------------------------
    - name: Allow SSH through UFW
      ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp

    - name: Enable UFW and set default deny incoming, allow outgoing
      ufw:
        state: enabled
        direction: incoming
        policy: deny
      notify: Restart UFW

    - name: Set UFW default allow outgoing
      ufw:
        direction: outgoing
        policy: allow

    # ---------------------------------------------------------
    # 5. SSH HARDENING
    # ---------------------------------------------------------
    - name: Disable Root Login via SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Disable Password Authentication via SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    - name: Disable Empty Passwords via SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
        state: present
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH

    # ---------------------------------------------------------
    # 6. FAIL2BAN
    # ---------------------------------------------------------
    - name: Ensure Fail2Ban is enabled and running
      systemd:
        name: fail2ban
        state: started
        enabled: yes

  # ---------------------------------------------------------
  # HANDLERS
  # ---------------------------------------------------------
  handlers:
    - name: Restart SSH
      systemd:
        name: sshd
        state: restarted

    - name: Restart UFW
      systemd:
        name: ufw
        state: restarted
